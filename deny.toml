# cargo deny check: known vulnerabilities, licenses and where crates come from.
# CI runs it on every push; run it locally with `cargo deny check`.

[advisories]
# Every vulnerability and yanked release fails. Unmaintained crates fail only when we
# depend on them directly: ones deep in another crate's tree (zbus under eframe's Linux
# accessibility) are for that crate to replace.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses, plus MPL-2.0, whose copyleft covers only the files of that crate.
# A crate offering several licenses passes when one of them is here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
# Several versions of a crate come in through different dependencies; not worth failing on.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io: no git dependency or other registry slips in unnoticed.
unknown-registry = "deny"
unknown-git = "deny"
