name: Release

# Everything a release ships is built first: the desktop installers and the server image.
# Only when every build has passed, and CI has passed on the same commit, does the last job
# tag the image and publish the release with the installers attached, so no release or
# image tag points at missing files or untested code.
#
# Start it by pushing a vX.Y.Z tag, or run it by hand: with no tag it releases the version
# in Cargo.toml and creates that tag on the commit it built.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z); leave empty to release the version in Cargo.toml'
        required: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manual run without a tag releases the commit it was started on.
          ref: ${{ github.event.inputs.tag || github.sha }}
          # The tags, to refuse a version that is already released.
          fetch-depth: 0
          persist-credentials: false

      - name: Read the tag and Cargo.toml
        id: version
        shell: bash
        # Inputs reach the script as variables, never pasted into its source.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          PKG_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v$PKG_VERSION}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          # Installers are named after Cargo.toml and the updater looks for the tag's version.
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $PKG_VERSION but the tag is $TAG"
            exit 1
          fi
          # A release from Cargo.toml creates its tag, so an existing one means it is out already.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_TAG" ] &&
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG is already released; raise the version in Cargo.toml first"
            exit 1
          fi
          {
            echo "tag=$TAG"
            # Every job builds this commit, since a new tag exists only once the release is out.
            echo "sha=$(git rev-parse HEAD)"
            echo "version=$VERSION"
            # Image names must be lowercase; the repository name is not.
            echo "image=$REGISTRY/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            echo "prerelease=$([[ "$TAG" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: $VERSION"

  # CI already runs on every push to main; a release waits for that run on its commit
  # instead of repeating it, and is not published unless it passed.
  ci:
    name: CI passed
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          for attempt in $(seq 1 90); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '.workflow_runs | sort_by(.created_at) | last | select(. != null) | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              # A push starts CI at once; a commit it never saw cannot be released.
              if [ "$attempt" -ge 3 ]; then
                echo "::error::CI has not run on $SHA. Push it to main, or start CI on it from the Actions tab, then release again."
                exit 1
              fi
            else
              read -r status conclusion url <<< "$run"
              echo "CI is $status ($conclusion): $url"
              if [ "$status" = completed ]; then
                [ "$conclusion" = success ] && exit 0
                echo "::error::CI did not pass on this commit ($conclusion): $url"
                exit 1
              fi
            fi
            sleep 60
          done
          echo "::error::CI on this commit did not finish within 90 minutes"
          exit 1

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Linux libraries
        if: runner.os == 'Linux'
        # libfuse2 runs the AppImage tooling; the app itself uses FUSE 3.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libfuse2t64

      # Built from scratch on purpose: installers people download must not come
      # from an Actions cache another workflow could have written.
      - name: Build installers
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          cargo install cargo-packager --locked --version 0.11.8
          cargo xtask package
          # The installers only; the packager also leaves working folders (the .app bundle) here.
          mkdir -p installers
          find target/packages -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} installers/ \;
          ls -la installers

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Docker image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}

      # Pushed by digest only: nobody pulls it until the publish job gives it tags.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.version.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          # No layer cache: a tag run can read only main's caches, never another
          # tag's, and a published image must not be built from a shared cache.

  publish:
    name: Publish release
    needs: [version, ci, desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4.1.2 also gets 4.1, 4 and latest; a pre-release (4.2.0-rc.1) only its own tag.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}

      - name: Tag the image
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "${tags[0]}"

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Release ${{ needs.version.outputs.tag }}
          body: |
            ## Release ${{ needs.version.outputs.tag }}

            ### Docker Image
            ```bash
            docker pull ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
            docker pull ${{ needs.version.outputs.image }}:latest
            ```

            ### Changes
            See [Full Changelog](https://tma-cloud.github.io/Wiki/docs/changelog/overview) for details
          files: installers/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
