name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., vX.Y.Z)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Version: $VERSION"

      - name: Verify version matches Cargo.toml
        run: |
          PKG_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Warning: Workspace version ($PKG_VERSION) doesn't match tag version (${{ steps.version.outputs.version }})"
          fi

      - name: Get previous tag
        id: prev_tag
        shell: bash
        run: |
          # List tags sorted by creation date, exclude the current tag, and grab the most recent one
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ steps.version.outputs.tag }}$" | head -n 1)
          
          # If no previous tag exists (e.g., first release), fallback to the initial commit hash
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag resolved to: $PREV_TAG"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Release ${{ steps.version.outputs.tag }}

            ### Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.version }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ```

            ### Changes
            See [Full Changelog](https://tma-cloud.github.io/Wiki/docs/changelog/overview) for details
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux libraries
        if: runner.os == 'Linux'
        # libfuse2 runs the AppImage tooling; the app itself uses FUSE 3.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libfuse2t64

      - name: Build installers
        shell: bash
        run: |
          rustup update stable --no-self-update && rustup default stable
          cargo install cargo-packager --locked
          cargo xtask package

      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          # The installers only; the packager also leaves working folders (the .app bundle) here.
          find target/packages -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0 |
            xargs -0 gh release upload "$TAG" --clobber
