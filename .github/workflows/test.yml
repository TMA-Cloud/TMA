name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      # The desktop app's Linux build links against D-Bus (keyring) at test time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Web build (wasm)
        run: cargo clippy -p tma-cloud-web -p tma-ui -p tma-client --target wasm32-unknown-unknown -- -D warnings

  integration:
    name: Server integration
    runs-on: ubuntu-latest

    # The suite talks to a real database, cache and bucket; here they are
    # throwaway containers.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tma
          POSTGRES_PASSWORD: tma
          POSTGRES_DB: tma_cloud_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TMA_TEST_DATABASE_URL: postgresql://tma:tma@localhost:5432/tma_cloud_test
      TMA_TEST_REDIS_URL: redis://localhost:6379/15
      TMA_TEST_S3_ENDPOINT: http://localhost:9000
      TMA_TEST_S3_ACCESS_KEY: tmatestkey
      TMA_TEST_S3_SECRET_KEY: tmatestsecret123
      TMA_TEST_S3_BUCKET: tma-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Service containers cannot take arguments, and RustFS needs its data path.
      - name: Object storage
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=tmatestkey -e RUSTFS_SECRET_KEY=tmatestsecret123 \
            rustfs/rustfs:latest /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done

      - name: Toolchain
        run: rustup update stable --no-self-update && rustup default stable

      - name: Integration tests
        run: cargo test -p tma-server --test api -- --test-threads=1

  windows:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runners ship LLVM; the WinFsp bindings are generated with its libclang.
      - name: Build and test
        shell: bash
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          rustup update stable --no-self-update && rustup default stable
          cargo clippy -p tma-cloud -p tma-drive --all-targets -- -D warnings
          cargo test -p tma-drive -p tma-cloud

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These scripts write keys and passwords on users' servers; shellcheck ships with the runner.
      - name: Shellcheck
        run: shellcheck setup.sh update.sh rotate.sh scripts/db-backup-restore.sh .githooks/pre-commit .githooks/pre-push .githooks/commit-msg
