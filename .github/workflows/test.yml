name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run still going. Runs on main
# always finish, so every commit there is tested and its cache saved.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debug info makes CI builds slower to link and caches bigger, and is never read.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      # Dependencies built by the last run on main. Only main saves: pull
      # requests read its cache, and theirs would crowd it out of the 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The desktop app's Linux build links against D-Bus (keyring).
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # rustfmt for Rust, Prettier (the runner ships Node) for Markdown, YAML, JSON, HTML and CSS.
      - name: Format
        run: cargo xtask fmt --check

      # File size, copied code and theme colours; see CLAUDE.md.
      - name: House rules
        run: cargo xtask house

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Web build (wasm)
        run: cargo clippy -p tma-cloud-web -p tma-ui -p tma-client --target wasm32-unknown-unknown -- -D warnings

  # Apart from lint, which only checks code the tests build, so the two run side
  # by side. Covers the Linux desktop app and Cloud Drive, which are workspace members.
  test:
    name: Tests
    runs-on: ubuntu-latest

    # The server suite talks to a real database, cache and bucket; here they
    # are throwaway containers.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tma
          POSTGRES_PASSWORD: tma
          POSTGRES_DB: tma_cloud_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Service containers cannot take arguments, and RustFS needs its data path.
      - name: Object storage
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=tmatestkey -e RUSTFS_SECRET_KEY=tmatestsecret123 \
            rustfs/rustfs:latest /data
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done

      - name: Toolchain
        run: rustup update stable --no-self-update && rustup default stable

      # Dependencies built by the last run on main. Only main saves: pull
      # requests read its cache, and theirs would crowd it out of the 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The desktop app's Linux build links against D-Bus (keyring) at test time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # The server suites skip themselves here, without the TMA_TEST_* settings.
      - name: Unit tests
        run: cargo test --workspace

      # Selected with --workspace so Cargo resolves the same features and reuses
      # the binaries the step above built. One thread: the suites share a database.
      - name: Server integration tests
        env:
          TMA_TEST_DATABASE_URL: postgresql://tma:tma@localhost:5432/tma_cloud_test
          TMA_TEST_REDIS_URL: redis://localhost:6379/15
          TMA_TEST_S3_ENDPOINT: http://localhost:9000
          TMA_TEST_S3_ACCESS_KEY: tmatestkey
          TMA_TEST_S3_SECRET_KEY: tmatestsecret123
          TMA_TEST_S3_BUCKET: tma-test
        run: cargo test --workspace --test api --test cache -- --test-threads=1

  desktop:
    name: Desktop app (${{ matrix.name }})
    # Each system has its own Cloud Drive adapter and app glue, built only
    # there; Linux is covered by the jobs above.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        shell: bash
        run: rustup update stable --no-self-update && rustup default stable

      # Dependencies built by the last run on main. Only main saves: pull
      # requests read its cache, and theirs would crowd it out of the 10 GB.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint and test
        shell: bash
        run: |
          cargo clippy -p tma-cloud -p tma-drive --all-targets -- -D warnings
          cargo test -p tma-drive -p tma-cloud

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These scripts write keys and passwords on users' servers; shellcheck ships with the runner.
      - name: Shellcheck
        run: shellcheck -x setup.sh update.sh rotate.sh scripts/db-backup-restore.sh .githooks/pre-commit .githooks/pre-push .githooks/commit-msg
