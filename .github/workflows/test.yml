name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Check formatting
        working-directory: backend
        run: npm run format:check

      - name: Test
        working-directory: backend
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  integration:
    name: Backend integration
    runs-on: ubuntu-latest

    # The suite talks to a real database and cache. Locally these come from
    # .env; in CI they are throwaway service containers.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tma
          POSTGRES_PASSWORD: tma
          POSTGRES_DB: tma_cloud_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: tma
      DB_PASSWORD: tma
      DB_NAME: tma_cloud_test
      DB_SSLMODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      REDIS_DB: '15'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Integration tests
        working-directory: backend
        run: npm run test:integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Typecheck tests
        working-directory: frontend
        run: npx tsc -b tsconfig.test.json

      - name: Test
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7
