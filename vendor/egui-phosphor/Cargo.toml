[package]
name = "egui-phosphor"
description = "Phosphor icons for egui"
version = "0.14.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/amPerl/egui-phosphor"

[dependencies]
# Patched: 0.37 instead of 0.36, the only change (see PATCHES.md).
egui = { version = "0.37", default-features = false }

[features]
default = ["regular"]
regular = []
fill = []
# Declared so the source's cfg checks stay valid; this copy ships only the regular
# and fill fonts, so enabling these fails to build (see PATCHES.md).
thin = []
light = []
bold = []
subset = []
