[package]
name = "tma-cloud"
description = "TMA Cloud desktop app for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tma-cloud"
path = "src/main.rs"

[dependencies]
tma-ui = { workspace = true }
tma-client = { workspace = true }
tma-core = { workspace = true }
tma-drive = { workspace = true }
chrono = { workspace = true }
egui = { workspace = true }
# clipboard: copy, cut and paste in text fields (its own feature since eframe 0.37).
eframe = { workspace = true, features = ["clipboard", "default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11"] }
image = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
open = "5"
dirs = "7"
# The saved sign-in, in the system's credential store (one store crate per system below).
keyring-core = "1"
env_logger = "0.11"
raw-window-handle = "0.6"
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# std provides get_file_list_path, which reads file paths off the Windows clipboard.
clipboard-win = { version = "5", features = ["std"] }
device_query = "4.0.1"
windows-native-keyring-store = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["render"] }
# Secret Service over D-Bus, with the D-Bus library built in so no extra package is needed.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSCursor", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Installers, built with `cargo xtask package` (cargo-packager): NSIS on
# Windows, a DMG on macOS, a .deb and an AppImage on Linux.
[package.metadata.packager]
product-name = "TMA Cloud"
identifier = "com.tmacloud.desktop"
publisher = "TMA Cloud"
authors = ["TMA Cloud <https://github.com/TMA-Cloud/TMA>"]
long-description = "Your TMA Cloud files on the desktop: browse, upload and share, edit files in the computer's own apps, and Cloud Drive, which opens the store as a drive or folder in every app's Open and Save dialogs."
category = "Productivity"
homepage = "https://tma-cloud.github.io/Wiki"
license-file = "../../LICENSE"
# The notice from LICENSE; shown in Finder and the package details.
copyright = "Copyright (c) 2025 Zinadin Zidan"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
binaries = [{ path = "tma-cloud", main = true }]

[package.metadata.packager.nsis]
# Per user, so installing needs no administrator. Cloud Drive uses the Cloud
# Files API built into Windows, so there is no driver to install alongside.
installer-mode = "currentUser"
installer-icon = "assets/icons/icon.ico"
sidebar-image = "assets/icons/installer-sidebar.bmp"
appdata-paths = ["$APPDATA/TMA Cloud", "$LOCALAPPDATA/TMA Cloud"]
# ForgetCloudDrive runs before the template's own uninstall section (uninstaller
# sections run in order); an update runs the old uninstaller with /P, and the drive
# folder stays then. SupportInfo adds the links and note Programs and Features shows,
# which the template does not write; the install section keeps them, and uninstalling
# removes the whole key.
preinstall-section = """
Section "SupportInfo"
  WriteRegStr SHCTX "${UNINSTKEY}" "HelpLink" "https://tma-cloud.github.io/Wiki"
  WriteRegStr SHCTX "${UNINSTKEY}" "URLInfoAbout" "https://github.com/TMA-Cloud/TMA"
  WriteRegStr SHCTX "${UNINSTKEY}" "URLUpdateInfo" "https://github.com/TMA-Cloud/TMA/releases"
  WriteRegStr SHCTX "${UNINSTKEY}" "Comments" "Desktop app for TMA Cloud, with Cloud Drive"
SectionEnd

Section "un.ForgetCloudDrive"
  ${GetOptions} $CMDLINE "/P" $R0
  IfErrors 0 forget_done
    nsis_tauri_utils::FindProcess "${MAINBINARYNAME}.exe"
    Pop $R0
    ${If} $R0 = 0
      IfSilent forget_kill 0
      MessageBox MB_OKCANCEL "$(appRunningOkKill)" IDOK forget_kill
      Abort
      forget_kill:
      nsis_tauri_utils::KillProcess "${MAINBINARYNAME}.exe"
      Pop $R0
      Sleep 500
    ${EndIf}
    DetailPrint "Removing the TMA Cloud folder's downloaded copies..."
    ExecWait '"$INSTDIR\\${MAINBINARYNAME}.exe" --forget-drive'
  forget_done:
SectionEnd
"""

[package.metadata.packager.deb]
# FUSE for Cloud Drive, D-Bus for the saved sign-in (Secret Service).
depends = ["fuse3", "libdbus-1-3"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
