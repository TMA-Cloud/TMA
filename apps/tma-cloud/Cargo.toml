[package]
name = "tma-cloud"
description = "TMA Cloud desktop app for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tma-cloud"
path = "src/main.rs"

[dependencies]
tma-ui = { workspace = true }
tma-client = { workspace = true }
tma-core = { workspace = true }
tma-drive = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "wayland", "x11"] }
image = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
open = "5"
notify = "8"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
device_query = "4.0.1"

[target.'cfg(windows)'.build-dependencies]
winfsp = { version = "0.13", default-features = false, features = ["delayload"] }
winresource = "0.1.34"

# Installers, built with `cargo xtask package` (cargo-packager): NSIS on
# Windows, a DMG on macOS, a .deb and an AppImage on Linux.
[package.metadata.packager]
product-name = "TMA Cloud"
identifier = "com.tmacloud.desktop"
publisher = "TMA Cloud"
authors = ["TMA Cloud <https://github.com/TMA-Cloud/TMA>"]
long-description = "Your TMA Cloud files on the desktop: browse, upload and share, edit files in the computer's own apps, and Cloud Drive, which opens the store as a drive or folder in every app's Open and Save dialogs."
category = "Productivity"
homepage = "https://tma-cloud.github.io/Wiki"
license-file = "../../LICENSE"
copyright = "MIT License"
icons = [
    "assets/icons/32x32.png",
    "assets/icons/128x128.png",
    "assets/icons/256x256.png",
    "assets/icons/512x512.png",
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
]
binaries = [{ path = "tma-cloud", main = true }]

[package.metadata.packager.nsis]
# Per user, so installing the app needs no administrator; only WinFsp asks.
installer-mode = "currentUser"
installer-icon = "assets/icons/icon.ico"
sidebar-image = "assets/icons/installer-sidebar.bmp"
appdata-paths = ["$APPDATA/TMA Cloud", "$LOCALAPPDATA/TMA Cloud"]
# Cloud Drive needs WinFsp. The xtask points TMA_WINFSP_MSI at a checked copy
# of the official MSI; it is installed (one UAC prompt) only when missing.
preinstall-section = """
Section "WinFsp" SEC_WINFSP
  ; WinFsp registers in the 32-bit view; the installer's own view comes back after.
  SetRegView 32
  ReadRegStr $0 HKLM "SOFTWARE\\WinFsp" "InstallDir"
  SetRegView lastused
  StrCmp $0 "" 0 winfsp_done
    InitPluginsDir
    File "/oname=$PLUGINSDIR\\winfsp.msi" "$%TMA_WINFSP_MSI%"
    DetailPrint "Installing WinFsp for Cloud Drive..."
    ExecShellWait "runas" "msiexec.exe" '/i "$PLUGINSDIR\\winfsp.msi" /passive /norestart'
  winfsp_done:
SectionEnd
"""

[package.metadata.packager.deb]
# FUSE for Cloud Drive, D-Bus for the saved sign-in (Secret Service).
depends = ["fuse3", "libdbus-1-3"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
