[package]
name = "tma-cloud-web"
description = "TMA Cloud in the browser: the shared egui interface on the eframe web runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tma-cloud-web"
path = "src/main.rs"

# Everything is for the browser build; natively the binary only says how to build it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tma-ui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
