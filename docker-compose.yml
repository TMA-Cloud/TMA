# ----------------------------------------------------------------------------------------
# TMA Cloud | Docker Compose Configuration
# Installation Guide: https://tma-cloud.github.io/Wiki/docs/getting-started/installation/
# Prerequisites: '.env' and 'secrets/file_encryption_key' in the same directory.
# setup.sh creates both with random values:
#   curl -fsSL https://raw.githubusercontent.com/TMA-Cloud/TMA/main/setup.sh | bash
# Update with ./update.sh. Rotate the master key and the database and Redis
# passwords with ./rotate.sh. Put local changes in compose.override.yml.
# ----------------------------------------------------------------------------------------

services:
  # TMA Cloud App
  app:
    image: ghcr.io/tma-cloud/tma:latest
    container_name: tma-cloud-app
    restart: unless-stopped
    ports:
      - "${BPORT:-3000}:${BPORT:-3000}"
    env_file:
      - .env
    environment:
      - FILE_ENCRYPTION_KEY_FILE=/run/secrets/file_encryption_key
    secrets:
      - file_encryption_key
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BPORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tma-cloud-network

  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    container_name: tma-cloud-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-tma_cloud_storage}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    #ports:
      #- "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - tma-cloud-network
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache
  redis:
    image: redis:8-alpine
    container_name: tma-cloud-redis
    restart: unless-stopped
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - tma-cloud-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  # TMA Cloud background worker
  worker:
    image: ghcr.io/tma-cloud/tma:latest
    container_name: tma-cloud-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - FILE_ENCRYPTION_KEY_FILE=/run/secrets/file_encryption_key
    secrets:
      - file_encryption_key
    command: node backend/audit-worker.js
    # The image's check curls the API port, which the worker does not serve. A
    # crashed worker exits, and the restart policy brings it back.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tma-cloud-network

# The master key for every stored file, mounted at /run/secrets/file_encryption_key
# so it never appears in the environment or `docker inspect`. The app runs as uid
# 1001, so the file must be readable by it (setup.sh sets the permissions).
secrets:
  file_encryption_key:
    file: ./secrets/file_encryption_key

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  tma-cloud-network:
    driver: bridge
