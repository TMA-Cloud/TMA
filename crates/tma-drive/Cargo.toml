[package]
name = "tma-drive"
description = "Cloud Drive: TMA Cloud mounted as a local drive (Cloud Files on Windows, FUSE on Linux, NFS on macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["mount"]
# The OS adapters (Cloud Files, FUSE, NFS); without them only the core builds, for tests.
mount = ["dep:cloud-filter", "dep:notify", "dep:windows", "dep:fuser", "dep:libc", "dep:nfsserve", "dep:async-trait", "dep:tokio"]

[dependencies]
tma-client = { workspace = true }
tma-core = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_System_CorrelationVector"], optional = true }
# The Cloud Files API (OneDrive's), so the drive needs no driver on Windows.
cloud-filter = { version = "0.0.6", optional = true }
notify = { version = "8", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
# macOS mounts Cloud Drive with its built-in NFS client, so no macFUSE is needed.
nfsserve = { version = "0.11", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
env_logger = "0.11"
