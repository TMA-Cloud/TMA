<!doctype html>
<html lang="en">
  <head>
    <meta name="theme-color" content="#1b1b19" />
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        var dark = t !== 'light';
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
        document.documentElement.style.backgroundColor = dark ? '#1b1b19' : '#f3f3f0';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#1b1b19' : '#f3f3f0');
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter with its optical-size axis, so glyph shapes adjust with size the
         way the type scale in index.css assumes. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="application-name" content="TMA Cloud" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TMA Cloud" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/tma-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/tma-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/tma-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TMA Cloud</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
